upstream api_upstream {
    server api:8000;
}

upstream web_upstream {
    server web:80;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 16M;

    location /api/ {
        proxy_pass http://api_upstream;
        # Host client transmis aux upstreams internes (api, web) qui ne s'en
        # servent pour aucune décision de sécurité (pas de génération d'URL absolue, pas
        # de cache par Host). Risque d'injection de Host non applicable ici.
        # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web_upstream;
        # Host client transmis aux upstreams internes (api, web) qui ne s'en
        # servent pour aucune décision de sécurité (pas de génération d'URL absolue, pas
        # de cache par Host). Risque d'injection de Host non applicable ici.
        # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
