upstream api_upstream {
    server api:8000;
}

upstream web_upstream {
    server web:80;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 16M;

    # Ne pas divulguer la version de nginx dans l'en-tête Server (ZAP 10036).
    server_tokens off;

    # En-têtes de sécurité, appliqués à toutes les réponses. Les locations
    # ci-dessous n'ont pas de `add_header` propre, elles en héritent donc.
    add_header X-Frame-Options "DENY" always;                    # anti-clickjacking (10020)
    add_header X-Content-Type-Options "nosniff" always;          # anti MIME-sniffing (10021)
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;  # (10063)
    # CSP stricte (10038). script-src 'self' : le bundle de l'app est
    # auto-hébergé, on ne tolère aucun script inline (l'app garde le JWT en
    # localStorage, un XSS le volerait). style-src autorise l'inline (styles
    # React) + la feuille Google Fonts ; font-src autorise gstatic.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Swagger UI / ReDoc : chargent leurs assets depuis jsdelivr et exécutent un
    # script d'init inline. CSP assouplie UNIQUEMENT pour ces deux pages de doc,
    # pour ne pas les casser — la CSP stricte de l'app (script-src 'self') reste
    # intacte partout ailleurs. Un add_header de location remplaçant les headers
    # hérités, on les redéclare tous ici.
    location ~ ^/api/(docs|redoc)$ {
        proxy_pass http://api_upstream;
        # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    }

    location /api/ {
        proxy_pass http://api_upstream;
        # Host client transmis aux upstreams internes (api, web) qui ne s'en
        # servent pour aucune décision de sécurité (pas de génération d'URL
        # absolue, pas de cache par Host). Injection de Host non applicable ici.
        # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pas d'add_header ici : sinon la location perd les en-têtes de sécurité
        # hérités du serveur (nginx les remplace au lieu de les fusionner).
    }

    location / {
        proxy_pass http://web_upstream;
        # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
