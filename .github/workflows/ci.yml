name: CI

# Pas de déclencheur `push` : tout ce qui entre dans `main` passe par une PR,
# donc a déjà été testé. Le rejouer sur le commit de merge ferait doublon.
#
# Cela suppose que `main` soit protégée : « require a pull request before
# merging » + « require status checks » avec « require branches to be up to
# date » (strict). Le strict est la clé — il garantit que l'état testé par la
# PR EST l'état fusionné. Sans protection, un push direct sur `main` ne
# déclencherait plus rien du tout. Voir INVENTAIRE.md, chantier C13.
on:
  pull_request:
  workflow_dispatch:

# Une seule exécution par branche : un nouveau push annule la précédente,
# encore en cours, plutôt que de faire la queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    # Postgres jetable : sert à appliquer les migrations sur une base vierge et
    # à lancer `alembic check`, ce que SQLite (utilisé par les tests) ne permet
    # pas — les migrations sont écrites pour Postgres (enums natifs).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gestion
          POSTGRES_PASSWORD: gestion
          POSTGRES_DB: gestion_projet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestion -d gestion_projet"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # On teste sur la version Python qu'on EXPÉDIE : l'image `api/Dockerfile`
      # est en 3.14, donc les tests tournent en 3.14. À garder aligné avec le
      # Dockerfile. (Le job `sast` reste en 3.12 : sa version ne sert qu'à faire
      # tourner semgrep, indépendant de ce qu'il analyse.)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      # Applique 0001…n sur une base vierge (les migrations tiennent la route)
      # PUIS vérifie que les modèles ne dérivent pas des migrations. `alembic
      # check` échoue si un modèle change sans migration correspondante — c'est
      # ce qui verrouille la réconciliation faite en C5.
      - name: Migrations + contrôle de dérive
        env:
          DATABASE_URL: postgresql+psycopg://gestion:gestion@localhost:5432/gestion_projet
        run: |
          alembic upgrade head
          alembic check
      - name: Tests
        run: pytest -q
      # C12b — rejoue la MÊME suite sur PostgreSQL. Les tests tournent sur SQLite
      # par défaut (rapide, rien à lancer en local) ; ce second passage éprouve ce
      # que SQLite ne sait pas fournir : les types ENUM natifs, et les CHECK sur un
      # vrai moteur. Cf. tests/test_contraintes_base.py, dont un test est ignoré
      # hors PostgreSQL.
      #
      # Base DÉDIÉE : la suite fait drop_all/create_all à chaque test, on ne veut
      # donc pas qu'elle piétine le schéma posé par `alembic upgrade head` ci-dessus
      # (dont dépend `alembic check`). Créée en Python — psycopg est déjà une
      # dépendance, inutile d'exiger psql sur le runner.
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://gestion:gestion@localhost:5432/gestion_test
        run: |
          python - <<'PY'
          import psycopg
          dsn = "host=localhost user=gestion password=gestion dbname=gestion_projet"
          with psycopg.connect(dsn, autocommit=True) as conn:
              existe = conn.execute(
                  "SELECT 1 FROM pg_database WHERE datname = 'gestion_test'"
              ).fetchone()
              if not existe:
                  conn.execute("CREATE DATABASE gestion_test")
                  print("base de test créée")
          PY
          pytest -q

  web:
    name: Web — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      # `npm ci` sans repli : le `|| npm install` d'avant masquait l'absence de
      # package-lock.json, et faisait flotter les versions à chaque exécution.
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: E2E — Playwright (planning)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Install
        run: npm ci
      # Chromium seul : les runners Linux n'ont pas Edge (le channel local). Le
      # `--with-deps` installe les libs système requises par le navigateur.
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
      # Les e2e mockent l'API au niveau navigateur (aucun backend) ; la config
      # Playwright démarre le serveur Vite toute seule. En CI, channel=chromium.
      - name: E2E
        run: npm run test:e2e

  sast:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: pip install semgrep
      # `--error` : sortie non nulle s'il reste le moindre finding → le job
      # échoue, donc la PR est rouge et ne peut pas être fusionnée. Les
      # exceptions assumées sont documentées par des `# nosemgrep` justifiés
      # (CORS corrigé, actions épinglées, sidecar backup / Host proxy acceptés).
      - name: Semgrep (bloquant)
        run: >-
          semgrep scan --error --metrics=off
          --config p/python --config p/typescript --config p/react
          --config p/secrets --config p/security-audit
          --config p/owasp-top-ten --config p/dockerfile --config p/github-actions

  dast:
    name: DAST — ZAP Baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `--build` construit api, web ET backup — les trois seuls services ayant un
      # `build:` (db et proxy tirent une image). Ce job REMPLACE donc l'ancien job
      # « Docker — build images », qui refaisait exactement ces trois builds sans
      # les démarrer : redondant, et facturé en double sur un plan free.
      # Conséquence assumée : un build cassé se voit désormais ici, pas dans un job
      # dédié — le message est moins direct, mais l'information est la même.
      - name: Démarrer la stack
        run: |
          cp .env.example .env
          docker compose up -d --build
      # On attend /api/health : il ne répond 200 qu'une fois l'API prête
      # (migrations + seed + uvicorn), donc toute la stack est debout avant ZAP.
      - name: Attendre la stack
        run: |
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://localhost:8080/api/health && { echo "stack prête"; exit 0; }
            sleep 3
          done
          echo "stack pas prête à temps"; docker compose logs; exit 1
      # ZAP Baseline : scan passif (spider + règles passives, aucune attaque
      # active). Les exceptions assumées sont dans .zap/rules.tsv. Sans `-I`,
      # zap-baseline sort non nul au moindre WARN → job rouge, PR non fusionnable.
      - name: ZAP Baseline (bloquant)
        run: |
          docker run --network host -v "$PWD/.zap:/zap/wrk" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080 -c rules.tsv
      - name: Logs de la stack (si échec)
        if: failure()
        run: docker compose logs
      - name: Arrêter la stack
        if: always()
        run: docker compose down -v
