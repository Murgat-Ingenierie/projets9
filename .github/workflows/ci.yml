name: CI

# Pas de déclencheur `push` : tout ce qui entre dans `main` passe par une PR,
# donc a déjà été testé. Le rejouer sur le commit de merge ferait doublon.
#
# Cela suppose que `main` soit protégée : « require a pull request before
# merging » + « require status checks » avec « require branches to be up to
# date » (strict). Le strict est la clé — il garantit que l'état testé par la
# PR EST l'état fusionné. Sans protection, un push direct sur `main` ne
# déclencherait plus rien du tout. Voir INVENTAIRE.md, chantier C13.
on:
  pull_request:
  workflow_dispatch:

# Une seule exécution par branche : un nouveau push annule la précédente,
# encore en cours, plutôt que de faire la queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    # Postgres jetable : sert à appliquer les migrations sur une base vierge et
    # à lancer `alembic check`, ce que SQLite (utilisé par les tests) ne permet
    # pas — les migrations sont écrites pour Postgres (enums natifs).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gestion
          POSTGRES_PASSWORD: gestion
          POSTGRES_DB: gestion_projet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestion -d gestion_projet"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      # Applique 0001…n sur une base vierge (les migrations tiennent la route)
      # PUIS vérifie que les modèles ne dérivent pas des migrations. `alembic
      # check` échoue si un modèle change sans migration correspondante — c'est
      # ce qui verrouille la réconciliation faite en C5.
      - name: Migrations + contrôle de dérive
        env:
          DATABASE_URL: postgresql+psycopg://gestion:gestion@localhost:5432/gestion_projet
        run: |
          alembic upgrade head
          alembic check
      - name: Tests
        run: pytest -q

  web:
    name: Web — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # `npm ci` sans repli : le `|| npm install` d'avant masquait l'absence de
      # package-lock.json, et faisait flotter les versions à chaque exécution.
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker — build images
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build API
        run: docker build -t gestion-projet-api:ci ./api
      - name: Build Web
        run: docker build -t gestion-projet-web:ci ./web
      - name: Build Backup
        run: docker build -t gestion-projet-backup:ci ./docker/backup
