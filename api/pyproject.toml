[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project]
name = "gestion-projet-api"
version = "0.1.0"
description = "API du gestionnaire de projet pisciculture Les Fontaines"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "pyjwt>=2.10",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "httpx>=0.27",
    "ruff>=0.7",
    "black>=24.10",
]
# Dépendances des outils one-shot de scripts/ (import du classeur source).
# Étaient importées sans être déclarées nulle part. Install : pip install -e ".[scripts]"
scripts = [
    "requests>=2.32",
    "openpyxl>=3.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Les migrations sont des artefacts historiques : on ne les reformate pas
# après coup, sinon le fichier ne correspond plus à ce qui a été appliqué.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# UP042 : passage de (str, Enum) à StrEnum. Reporté en phase 2 — change le
# résultat de str() sur des enums sérialisés par l'API, à faire une fois les
# tests d'invariants en place pour rattraper une éventuelle régression.
ignore = ["E501", "UP042"]

[tool.ruff.lint.flake8-bugbear]
# Sans ça, B008 remonte un faux positif sur chaque `= Depends(...)`, qui est
# l'idiome normal d'injection de FastAPI (82 occurrences dans app/).
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
