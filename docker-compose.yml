services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SEED_CSV_PATH: /seed/epics.csv
      SEED_DEMO: ${SEED_DEMO:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Adossement Keycloak — OBLIGATOIRE : c'est le seul moyen d'authentifier
      # depuis le retrait du login maison, et l'API refuse de démarrer sans.
      # Pas de valeur par défaut ici, volontairement : une valeur par défaut
      # ferait démarrer le conteneur sur un realm qui n'existe pas, et le
      # symptôme (tout le monde en 401) ne désignerait pas la cause.
      # Ce service ne reçoit QUE les variables listées ici — les mettre dans
      # `.env` ne suffit pas, il faut aussi les déclarer dans ce bloc.
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:?renseigner KEYCLOAK_BASE_URL dans .env}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?renseigner KEYCLOAK_REALM dans .env}
      KEYCLOAK_API_AUDIENCE: ${KEYCLOAK_API_AUDIENCE:-projets9-api}
    volumes:
      - ./Liste des projets en cours - Epic.csv:/seed/epics.csv:ro
      # Historique des sauvegardes : LECTURE SEULE. L'API les liste, elle ne
      # peut ni en écrire ni en supprimer (c'est le conteneur `backup` qui le
      # fait). Cf. SPEC §4 écran 11.
      - backups:/backups:ro
      # Volume d'échange : l'API y dépose une sentinelle pour demander un dump.
      - backup_trigger:/trigger
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ./web
      # Vite inscrit ces valeurs dans le bundle AU BUILD (pas au démarrage) :
      # changer la config OIDC impose donc de reconstruire l'image `web`
      # (docker compose up -d --build web). Obligatoires, comme côté API : un
      # front sans OIDC n'obtient aucun jeton, et l'API les exige tous.
      args:
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:?renseigner VITE_OIDC_AUTHORITY dans .env}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:?renseigner VITE_OIDC_CLIENT_ID dans .env}
        VITE_OIDC_API_CLIENT_ID: ${VITE_OIDC_API_CLIENT_ID:-projets9-api}
    restart: unless-stopped
    depends_on:
      - api

  backup:
    build:
      context: ./docker/backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
      BACKUP_MIN_COPIES: ${BACKUP_MIN_COPIES:-7}
      BACKUP_TRIGGER_DIR: /trigger
      # uid de l'utilisateur applicatif de l'image API (non-root) : le volume
      # d'échange lui est donné au démarrage, sinon il ne peut pas y écrire.
      BACKUP_TRIGGER_UID: "10001"
    volumes:
      - backups:/backups
      - backup_trigger:/trigger
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PROXY_PORT}:80"
    environment:
      # Origine du serveur d'authentification, injectée dans la CSP au démarrage.
      # Sans elle, la CSP stricte BLOQUE le navigateur qui tente de joindre
      # Keycloak — l'application se charge puis reste sur un écran d'erreur, sans
      # que rien dans les journaux serveur ne l'explique. D'où l'exigence.
      KEYCLOAK_ORIGIN: ${KEYCLOAK_ORIGIN:?renseigner KEYCLOAK_ORIGIN dans .env (origine du serveur Keycloak)}
      # ⚠️ Restreint la substitution à CETTE variable. Sans ce filtre, envsubst
      # remplacerait aussi les variables de nginx lui-même ($host, $uri,
      # $remote_addr…) par du vide — et la configuration deviendrait absurde.
      NGINX_ENVSUBST_FILTER: "KEYCLOAK_ORIGIN"
    volumes:
      # Template : l'entrypoint nginx substitue les variables puis écrit le
      # résultat dans /etc/nginx/conf.d/default.conf.
      - ./docker/proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  backups:
  backup_trigger:
