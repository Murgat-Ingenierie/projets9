services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRES_MIN: ${JWT_EXPIRES_MIN}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME}
      SEED_CSV_PATH: /seed/epics.csv
      # Auth débrayée par défaut en attendant Keycloak (login + guards retirés
      # côté front). get_current_user renvoie l'admin par défaut. Repasser à
      # false quand Keycloak sera branché.
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      SEED_DEMO: ${SEED_DEMO:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - ./Liste des projets en cours - Epic.csv:/seed/epics.csv:ro
      # Historique des sauvegardes : LECTURE SEULE. L'API les liste, elle ne
      # peut ni en écrire ni en supprimer (c'est le conteneur `backup` qui le
      # fait). Cf. SPEC §4 écran 11.
      - backups:/backups:ro
      # Volume d'échange : l'API y dépose une sentinelle pour demander un dump.
      - backup_trigger:/trigger
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ./web
      # Vite inscrit ces valeurs dans le bundle AU BUILD (pas au démarrage) :
      # changer la config OIDC impose donc de reconstruire l'image `web`.
      # Vides = adossement inactif.
      args:
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
        VITE_OIDC_API_CLIENT_ID: ${VITE_OIDC_API_CLIENT_ID:-projets9-api}
    restart: unless-stopped
    depends_on:
      - api

  backup:
    build:
      context: ./docker/backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
      BACKUP_MIN_COPIES: ${BACKUP_MIN_COPIES:-7}
      BACKUP_TRIGGER_DIR: /trigger
      # uid de l'utilisateur applicatif de l'image API (non-root) : le volume
      # d'échange lui est donné au démarrage, sinon il ne peut pas y écrire.
      BACKUP_TRIGGER_UID: "10001"
    volumes:
      - backups:/backups
      - backup_trigger:/trigger
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PROXY_PORT}:80"
    volumes:
      - ./docker/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  backups:
  backup_trigger:
